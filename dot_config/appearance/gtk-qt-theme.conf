# Unified GTK / Qt Appearance Settings
# Agent 2: Theme & Visual Design Specialist

# GTK Theme & Fonts
gtk-theme-name = TokyoNight-Dark
gtk-icon-theme-name = BeautyLine
gtk-font-name = JetBrainsMono Nerd Font 10
gtk-cursor-theme-name = Bibata-Modern-Classic
gtk-cursor-theme-size = 24

# Qt Environment Integration
qt-platform-theme = qt5ct
qt-style-name = kvantum-dark

# Color Sync Variables
THEME_BG="#1a1625"
THEME_SURFACE="#241b35"
THEME_ACCENT_PINK="#f70068"
THEME_ACCENT_CYAN="#00e5ff"
THEME_FG="#e0def4"
