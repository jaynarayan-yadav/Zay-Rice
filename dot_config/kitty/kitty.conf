# ==============================================================================
# KITTY TERMINAL CONFIGURATION
# Background opacity: 0.75 | Font: JetBrainsMono Nerd Font
# ==============================================================================

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Opacity Rules (Strict Requirement)
background_opacity 0.75
dynamic_background_opacity yes

# Tokyo Night Synth Color Scheme
background #1a1625
foreground #e0def4
selection_background #f70068
selection_foreground #1a1625

# Cursor Styling
cursor #00e5ff
cursor_text_color #1a1625
cursor_shape beam
cursor_beam_thickness 1.5

# Color Palette (Standard & Bright)
# Black / Gray
color0 #241b35
color8 #4f3d6b

# Red / Neon Pink
color1 #f70068
color9 #ff2a85

# Green
color2 #00e676
color10 #5cff9d

# Yellow
color3 #ffe57f
color11 #fff176

# Blue / Electric Cyan
color4 #00e5ff
color12 #64ffda

# Magenta
color5 #bb86fc
color13 #d7aefb

# Cyan
color6 #00b0ff
color14 #80d8ff

# White
color7 #e0def4
color15 #ffffff

# Window Dimensions & Padding
window_padding_width 12
confirm_os_window_close 0
enable_audio_bell no
