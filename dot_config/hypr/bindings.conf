# ==============================================================================
# HYPRLAND KEYBINDINGS CONFIGURATION
# ==============================================================================

$mainMod = SUPER

# --- APPLICATION LAUNCHERS ---
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Space,  exec, wofi --show drun
bind = $mainMod, E,      exec, dolphin
bind = $mainMod, V,      exec, code
bind = $mainMod, Q,      killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, F,      togglefloating,
bind = $mainMod, P,      pseudo,       # dwindle pseudotile
bind = $mainMod, J,      togglesplit,  # dwindle split direction

# --- SCREEN LOCK & POWER ---
# Note: Super+Shift+L used for lock to avoid conflict with Super+L movefocus
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod SHIFT, P, exec, wlogout

# --- SCREENSHOT (requires: yay -S hyprshot) ---
bind = , Print,      exec, hyprshot -m region
bind = SHIFT, Print, exec, hyprshot -m window
bind = SUPER, Print, exec, hyprshot -m output

# --- NOTIFICATIONS (requires: swaync) ---
bind = $mainMod, N,       exec, swaync-client -t
bind = $mainMod SHIFT, N, exec, swaync-client -C

# --- CLIPBOARD PICKER ---
bind = $mainMod, Z, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# --- WINDOW MANAGEMENT ---
# Move focused window to a different tiling position (NOT half-screen snap).
# For true 50/50 visual snap, drag windows with Super + LMB or use resize binds below.
bind = $mainMod, Left,  movewindow, l
bind = $mainMod, Right, movewindow, r
bind = $mainMod, Up,    movewindow, u
bind = $mainMod, Down,  movewindow, d

# Focus Navigation (vim-style)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Window Resizing
bind = $mainMod SHIFT, Left,  resizeactive, -100 0
bind = $mainMod SHIFT, Right, resizeactive,  100 0
bind = $mainMod SHIFT, Up,    resizeactive,    0 -100
bind = $mainMod SHIFT, Down,  resizeactive,    0  100

# --- MINIMIZE & RESTORE ---
bind = $mainMod, M,       movetoworkspace, special:minimized
bind = $mainMod SHIFT, M, togglespecialworkspace, minimized

# --- WORKSPACE SWITCHING ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# --- MOUSE BINDINGS ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
