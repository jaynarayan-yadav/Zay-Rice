# ==============================================================================
# HYPRLAND WINDOW RULES CONFIGURATION
# Opacity, dialog floating, and minimize-to-special-workspace rules
# ==============================================================================

# --- OPACITY RULES (0.75 target for terminal and editor) ---
windowrulev2 = opacity 0.75 override 0.75, class:^(kitty)$
windowrulev2 = opacity 0.75 override 0.75, class:^(foot)$

# VSCode (Official, VSCodium, and Wayland variants)
windowrulev2 = opacity 0.75 override 0.75, class:^(Code)$
windowrulev2 = opacity 0.75 override 0.75, class:^(code-url-handler)$
windowrulev2 = opacity 0.75 override 0.75, class:^(vscodium)$
windowrulev2 = opacity 0.75 override 0.75, class:^(code-oss)$

# --- OPAQUE OVERRIDES — Auth prompts, file pickers, system dialogs MUST be fully opaque ---
windowrulev2 = opacity 1.0 override 1.0, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = opacity 1.0 override 1.0, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = opacity 1.0 override 1.0, class:^(pavucontrol)$
windowrulev2 = opacity 1.0 override 1.0, class:^(nm-connection-editor)$
windowrulev2 = opacity 1.0 override 1.0, class:^(blueman-manager)$
windowrulev2 = opacity 1.0 override 1.0, title:^(Open File)$
windowrulev2 = opacity 1.0 override 1.0, title:^(Save File)$
windowrulev2 = opacity 1.0 override 1.0, title:^(Confirm to replace files)$
windowrulev2 = opacity 1.0 override 1.0, title:^(File Operation Progress)$

# --- DIALOG & GUI FLOAT RULES ---
# System dialogs and popups float and center individually (no global center rule)
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = center, class:^(org.kde.polkit-kde-authentication-agent-1)$

windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$

windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(nm-connection-editor)$

windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$

windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, title:^(Confirm to replace files)$
windowrulev2 = float, title:^(File Operation Progress)$
