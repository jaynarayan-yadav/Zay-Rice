# ==============================================================================
# HYPRLAND WINDOW RULES CONFIGURATION
# Managed by Theme Specialist & Window Management Specialist
# ==============================================================================

# --- OPACITY RULES (Strict 0.75 Target) ---
# Kitty Terminal
windowrulev2 = opacity 0.75 override 0.75, class:^(kitty)$
windowrulev2 = opacity 0.75 override 0.75, class:^(foot)$

# VSCode (Official, VSCodium, and Wayland variants)
windowrulev2 = opacity 0.75 override 0.75, class:^(Code)$
windowrulev2 = opacity 0.75 override 0.75, class:^(code-url-handler)$
windowrulev2 = opacity 0.75 override 0.75, class:^(vscodium)$
windowrulev2 = opacity 0.75 override 0.75, class:^(code-oss)$

# --- MINIMIZE TO SPECIAL WORKSPACE ---
# Send minimized windows silently to the hidden special workspace
windowrulev2 = workspace special:minimized silent, movedtoworkspace:special:minimized

# --- DIALOG & GUI FLOAT RULES ---
# File pickers, settings dialogs, and authentication prompts float centered like macOS/Windows
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, title:^(Confirm to replace files)$
windowrulev2 = float, title:^(File Operation Progress)$
windowrulev2 = center, floating:1
