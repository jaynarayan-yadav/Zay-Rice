# Hyprpaper Wallpaper Loader Config
# Default: tokyo-lofi-cityscape (primary Tokyo Night Synth mood)
# Switch wallpapers using: ~/.config/hypr/scripts/wallpaper.sh [name]

# Preload all available wallpapers (low RAM cost when not displayed)
preload = ~/.config/appearance/wallpapers/tokyo-lofi-cityscape.jpg
preload = ~/.config/appearance/wallpapers/dark-figure-purple.png
preload = ~/.config/appearance/wallpapers/samurai-ghost-warrior.jpg

# Active wallpaper (change this line, then run: hyprctl hyprpaper reload)
wallpaper = ,~/.config/appearance/wallpapers/tokyo-lofi-cityscape.jpg

# Enable IPC so wallpaper.sh can hot-swap without restart
ipc = on
