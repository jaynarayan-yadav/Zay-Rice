# ==============================================================================
# HYPRLAND MAIN CONFIGURATION FILE — Pure Standalone Session (No KDE Plasma)
# ==============================================================================

# 1. Source Central Palette (single source of truth)
source = ~/.config/appearance/colors.conf

# 2. Source Modular Configurations
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/bindings.conf

# 3. Autostart Daemons (pure Hyprland — no KDE daemons)
exec-once = ~/.config/autostart/environment.sh
exec-once = waybar -c ~/.config/waybar/config-top.jsonc -s ~/.config/waybar/style.css
exec-once = waybar -c ~/.config/waybar/config-dock.jsonc -s ~/.config/waybar/style.css
exec-once = hyprpaper
exec-once = bash -c "sleep 2 && ~/.config/hypr/scripts/wallpaper.sh tokyo-lofi-cityscape.jpg"
exec-once = hypridle
exec-once = swaync

# 4. General Settings
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = $border_active
    col.inactive_border = $border_inactive
    layout = dwindle
    resize_on_border = true

    snap {
        enabled = true
        window_gap = 15
        monitor_gap = 15
    }
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.92

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = false
        xray = false
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = $shadow_color
    }
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
    # Hyprland splash screen off — keeps boot silent
    force_default_wallpaper = 0
}
