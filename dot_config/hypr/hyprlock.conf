# ==============================================================================
# HYPRLOCK SCREEN LOCK CONFIGURATION
# Pure Hyprland standalone — Tokyo Night Synth theme
# ==============================================================================

background {
    monitor =
    path = ~/.config/appearance/wallpapers/tokyo-lofi-cityscape.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.5
    contrast = 0.9
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(f70068)
    inner_color = rgb(241b35)
    font_color = rgb(e0def4)
    fade_on_empty = true
    hide_input = false
    placeholder_text = <span foreground="##e0def4">Enter Password</span>
    check_color = rgb(00e5ff)
    fail_color = rgb(f70068)
    fail_text = <i>Wrong Password</i>
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(e0def4ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgba(e0def480)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
