# ==============================================================================
# HYPRLAND ANIMATIONS CONFIGURATION
# Fluid, 60fps+ macOS-inspired animations with fast response times
# ==============================================================================

animations {
    enabled = true

    # Custom Bezier Curves
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = winDeco, 0.1, 1.0, 0.1, 1.0

    # Animation Definitions
    animation = windows, 1, 4, overshot, slide
    animation = windowsIn, 1, 4, overshot, slide
    animation = windowsOut, 1, 3, smoothOut, slide
    animation = windowsMove, 1, 4, winDeco

    animation = border, 1, 8, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 4, smoothIn
    animation = workspaces, 1, 5, overshot, slidevert
    animation = specialWorkspace, 1, 4, overshot, slidefadevert -50%
}
